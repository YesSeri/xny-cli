[package]
name = "xny"
edition = "2021"
rust-version = "1.88"
version = "1.0.6"
authors = ["Henrik Zenkert <henrik.zenkert@gmail.com>"]
license = "AGPL-1.0-or-later"
description = "A tool to search files"
readme = "README.md"
homepage = "https://github.com/YesSeri/xny-cli"
repository = "https://github.com/YesSeri/xny-cli"
keywords = ["cli", "search", "demo"]
categories = ["command-line-utilities"]

[dependencies]
serde_json = "1.0.154"
url = "2.5.8"
minreq = { version = "3.0.0", features = ["https"] }
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_yaml_ng = "0.10.0"
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }
dirs = "6.0"

[profile.release]
opt-level = 'z'     # Optimize for size
lto = true          # Enable link-time optimization
codegen-units = 1   # Reduce number of codegen units to increase optimizations
panic = 'abort'     # Abort on panic
strip = true        # Strip symbols from binary*
